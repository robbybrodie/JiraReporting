<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIRA CIPOE Analytics Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard-card {
            transition: transform 0.2s;
        }
        .dashboard-card:hover {
            transform: translateY(-5px);
        }
        #network-graph {
            height: 500px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .issue-item {
            transition: background-color 0.2s;
        }
        .issue-item:hover {
            background-color: #f8f9fa;
        }
        .priority-high { border-left: 4px solid #dc3545; }
        .priority-medium { border-left: 4px solid #ffc107; }
        .priority-low { border-left: 4px solid #28a745; }
        .priority-highest { border-left: 4px solid #6f42c1; }
        .status-badge {
            font-size: 0.8em;
        }
        .loading-spinner {
            display: none;
        }
        .chart-container {
            position: relative;
            height: 300px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-project-diagram"></i> JIRA CIPOE Analytics
            </span>
            <div class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search issues..." id="searchInput">
                <button class="btn btn-outline-light" type="button" onclick="searchIssues()">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Dashboard Stats -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card dashboard-card bg-primary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 id="totalIssues">-</h4>
                                <small>Total Issues</small>
                            </div>
                            <i class="fas fa-ticket-alt fa-2x opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card dashboard-card bg-success text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 id="cipoeIssues">-</h4>
                                <small>CIPOE Issues</small>
                            </div>
                            <i class="fas fa-bug fa-2x opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card dashboard-card bg-info text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 id="totalRelationships">-</h4>
                                <small>Relationships</small>
                            </div>
                            <i class="fas fa-link fa-2x opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card dashboard-card bg-warning text-dark">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 id="lastUpdate">-</h4>
                                <small>System Status</small>
                            </div>
                            <i class="fas fa-heartbeat fa-2x opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-chart-pie"></i> Priority Distribution</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="priorityChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-chart-bar"></i> Status Distribution</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="issues-tab" data-bs-toggle="tab" data-bs-target="#issues" type="button" role="tab">
                    <i class="fas fa-list"></i> Issues List
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="graph-tab" data-bs-toggle="tab" data-bs-target="#graph" type="button" role="tab" onclick="loadGraph()">
                    <i class="fas fa-project-diagram"></i> Graph View
                </button>
            </li>
        </ul>

        <div class="tab-content" id="mainTabContent">
            <!-- Issues List Tab -->
            <div class="tab-pane fade show active" id="issues" role="tabpanel">
                <div class="card mt-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">CIPOE Issues</h5>
                        <button class="btn btn-sm btn-primary" onclick="loadIssues()">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="loading-spinner text-center" id="issuesLoading">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                        <div id="issuesList"></div>
                        <nav class="mt-3">
                            <ul class="pagination justify-content-center" id="issuesPagination"></ul>
                        </nav>
                    </div>
                </div>
            </div>

            <!-- Graph View Tab -->
            <div class="tab-pane fade" id="graph" role="tabpanel">
                <div class="card mt-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Issue Relationships Graph</h5>
                        <div>
                            <select class="form-select form-select-sm d-inline-block w-auto me-2" id="graphLimit">
                                <option value="25">25 nodes</option>
                                <option value="50" selected>50 nodes</option>
                                <option value="100">100 nodes</option>
                            </select>
                            <button class="btn btn-sm btn-primary" onclick="loadGraph()">
                                <i class="fas fa-sync-alt"></i> Refresh
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="loading-spinner text-center" id="graphLoading">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                        <div id="network-graph"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Issue Detail Modal -->
    <div class="modal fade" id="issueDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="issueDetailTitle">Issue Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="issueDetailBody">
                    <div class="text-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPage = 0;
        let priorityChart, statusChart;
        let network;

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
            loadIssues();
        });

        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();
                
                document.getElementById('totalIssues').textContent = stats.total_issues;
                document.getElementById('cipoeIssues').textContent = stats.cipoe_issues;
                document.getElementById('totalRelationships').textContent = stats.total_relationships;
                document.getElementById('lastUpdate').textContent = 'Active';
                
                // Create charts
                createPriorityChart(stats.priority_breakdown);
                createStatusChart(stats.status_breakdown);
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function createPriorityChart(data) {
            const ctx = document.getElementById('priorityChart').getContext('2d');
            if (priorityChart) priorityChart.destroy();
            
            priorityChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: data.map(d => d.priority),
                    datasets: [{
                        data: data.map(d => d.count),
                        backgroundColor: ['#dc3545', '#ffc107', '#28a745', '#6f42c1', '#17a2b8']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        function createStatusChart(data) {
            const ctx = document.getElementById('statusChart').getContext('2d');
            if (statusChart) statusChart.destroy();
            
            statusChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.status),
                    datasets: [{
                        data: data.map(d => d.count),
                        backgroundColor: '#4ecdc4'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        async function loadIssues(page = 0) {
            const loading = document.getElementById('issuesLoading');
            const issuesList = document.getElementById('issuesList');
            
            loading.style.display = 'block';
            issuesList.innerHTML = '';
            
            try {
                const response = await fetch(`/api/issues?skip=${page * 25}&limit=25`);
                const issues = await response.json();
                
                let html = '';
                issues.forEach(issue => {
                    const priorityClass = `priority-${issue.priority?.toLowerCase() || 'medium'}`;
                    html += `
                        <div class="issue-item p-3 border-bottom ${priorityClass}" style="cursor: pointer;" onclick="showIssueDetail('${issue.key}')">
                            <div class="row">
                                <div class="col-md-2">
                                    <strong>${issue.key}</strong>
                                </div>
                                <div class="col-md-6">
                                    <div class="text-truncate">${issue.summary}</div>
                                </div>
                                <div class="col-md-2">
                                    <span class="badge bg-secondary status-badge">${issue.status}</span>
                                </div>
                                <div class="col-md-2">
                                    <small class="text-muted">${issue.priority || 'N/A'}</small>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                issuesList.innerHTML = html;
                currentPage = page;
                updatePagination();
            } catch (error) {
                console.error('Error loading issues:', error);
                issuesList.innerHTML = '<div class="alert alert-danger">Error loading issues</div>';
            } finally {
                loading.style.display = 'none';
            }
        }

        function updatePagination() {
            const pagination = document.getElementById('issuesPagination');
            let html = '';
            
            if (currentPage > 0) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="loadIssues(${currentPage - 1})">Previous</a></li>`;
            }
            
            html += `<li class="page-item active"><span class="page-link">${currentPage + 1}</span></li>`;
            html += `<li class="page-item"><a class="page-link" href="#" onclick="loadIssues(${currentPage + 1})">Next</a></li>`;
            
            pagination.innerHTML = html;
        }

        async function loadGraph() {
            const loading = document.getElementById('graphLoading');
            const limit = document.getElementById('graphLimit').value;
            
            loading.style.display = 'block';
            
            try {
                const response = await fetch(`/api/graph?limit=${limit}`);
                const data = await response.json();
                
                const container = document.getElementById('network-graph');
                const options = {
                    nodes: {
                        shape: 'dot',
                        size: 16,
                        font: {
                            size: 12,
                            color: '#333'
                        }
                    },
                    edges: {
                        width: 1,
                        color: {inherit: 'from'},
                        smooth: {
                            type: 'continuous'
                        }
                    },
                    physics: {
                        stabilization: false,
                        barnesHut: {
                            gravitationalConstant: -8000,
                            springConstant: 0.001,
                            springLength: 200
                        }
                    },
                    interaction: {
                        tooltipDelay: 200,
                        hideEdgesOnDrag: true
                    }
                };
                
                network = new vis.Network(container, data, options);
                
                // Handle node clicks
                network.on('click', function(params) {
                    if (params.nodes.length > 0) {
                        showIssueDetail(params.nodes[0]);
                    }
                });
                
            } catch (error) {
                console.error('Error loading graph:', error);
            } finally {
                loading.style.display = 'none';
            }
        }

        async function showIssueDetail(issueKey) {
            const modal = new bootstrap.Modal(document.getElementById('issueDetailModal'));
            const title = document.getElementById('issueDetailTitle');
            const body = document.getElementById('issueDetailBody');
            
            title.textContent = issueKey;
            body.innerHTML = '<div class="text-center"><div class="spinner-border" role="status"></div></div>';
            modal.show();
            
            try {
                const response = await fetch(`/api/issue/${issueKey}`);
                const data = await response.json();
                
                let html = `
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>Key:</strong></div>
                        <div class="col-sm-9">${data.issue.key}</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>Summary:</strong></div>
                        <div class="col-sm-9">${data.issue.summary}</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>Status:</strong></div>
                        <div class="col-sm-9"><span class="badge bg-secondary">${data.issue.status}</span></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>Priority:</strong></div>
                        <div class="col-sm-9">${data.issue.priority || 'N/A'}</div>
                    </div>
                `;
                
                if (data.related.length > 0) {
                    html += `
                        <hr>
                        <h6>Related Issues:</h6>
                        <div class="list-group">
                    `;
                    
                    data.related.forEach(rel => {
                        html += `
                            <div class="list-group-item">
                                <div class="d-flex w-100 justify-content-between">
                                    <h6 class="mb-1">${rel.key}</h6>
                                    <small class="text-muted">${rel.relationship_type}</small>
                                </div>
                                <p class="mb-1">${rel.summary}</p>
                            </div>
                        `;
                    });
                    
                    html += '</div>';
                }
                
                body.innerHTML = html;
            } catch (error) {
                body.innerHTML = '<div class="alert alert-danger">Error loading issue details</div>';
            }
        }

        async function searchIssues() {
            const query = document.getElementById('searchInput').value;
            if (!query) {
                loadIssues();
                return;
            }
            
            const loading = document.getElementById('issuesLoading');
            const issuesList = document.getElementById('issuesList');
            
            loading.style.display = 'block';
            
            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const issues = await response.json();
                
                let html = '';
                issues.forEach(issue => {
                    html += `
                        <div class="issue-item p-3 border-bottom" style="cursor: pointer;" onclick="showIssueDetail('${issue.key}')">
                            <div class="row">
                                <div class="col-md-3">
                                    <strong>${issue.key}</strong>
                                </div>
                                <div class="col-md-7">
                                    <div class="text-truncate">${issue.summary}</div>
                                </div>
                                <div class="col-md-2">
                                    <span class="badge bg-secondary status-badge">${issue.status}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                issuesList.innerHTML = html || '<div class="alert alert-info">No issues found</div>';
                document.getElementById('issuesPagination').innerHTML = '';
            } catch (error) {
                console.error('Error searching issues:', error);
                issuesList.innerHTML = '<div class="alert alert-danger">Error searching issues</div>';
            } finally {
                loading.style.display = 'none';
            }
        }

        // Search on Enter key
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchIssues();
            }
        });
    </script>
</body>
</html>
