# This file is a template for secrets that must be created manually
# DO NOT commit actual secret values to git

apiVersion: v1
kind: Secret
metadata:
  name: jira-credentials
  namespace: jira-cipoe-analytics
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: jira-cipoe-analytics
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Replace these values with actual credentials before applying
  JIRA_BASE_URL: "https://issues.redhat.com"
  JIRA_TOKEN: "YOUR_JIRA_TOKEN_HERE"
---
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-auth
  namespace: jira-cipoe-analytics
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # Replace with actual Neo4j credentials
  NEO4J_AUTH: "neo4j/YOUR_NEO4J_PASSWORD_HERE"
