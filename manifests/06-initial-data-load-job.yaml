  name: app-source-code
  namespace: jira-cipoe-analytics
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: jira-data-loader
    app.kubernetes.io/component: source-code
data:
  jira_neo4j_loader.py: |
    # This will be populated by the build process
    # For now, it's a placeholder - in a real deployment, this would contain
