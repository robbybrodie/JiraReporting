apiVersion: batch/v1
kind: Job
metadata:
  name: cipoe-data-load
  namespace: jira-cipoe-analytics
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: jira-data-loader
    app.kubernetes.io/component: data-load
    app.kubernetes.io/part-of: jira-analytics
    job-type: stomping-load
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  activeDeadlineSeconds: 7200  # 2 hours max
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jira-data-loader
        app.kubernetes.io/component: data-load
        job-type: stomping-load
    spec:
      restartPolicy: Never
      serviceAccountName: default
      containers:
      - name: data-loader
        image: registry.redhat.io/ubi8/python-39:latest
        imagePullPolicy: Always
        command: ["/bin/bash"]
        args:
        - -c
        - |
          set -e
          echo "Installing dependencies..."
          pip install requests neo4j
          
          echo "Starting stomping CIPOE data load (will clear existing data)..."
          python /app/jira_neo4j_loader.py \
            --page-size ${PAGE_SIZE:-50} \
            --max-results ${MAX_RESULTS:-5000} \
            --start-at ${START_AT:-0} \
            --stomp
          
          echo "Stomping data load completed successfully"
        env:
        - name: JIRA_BASE_URL
          valueFrom:
            secretKeyRef:
              name: jira-credentials
              key: JIRA_BASE_URL
        - name: JIRA_TOKEN
          valueFrom:
            secretKeyRef:
              name: jira-credentials
              key: JIRA_TOKEN
        - name: NEO4J_URI
          valueFrom:
            configMapKeyRef:
              name: data-loader-config
              key: NEO4J_URI
        - name: NEO4J_USERNAME
          valueFrom:
            configMapKeyRef:
              name: data-loader-config
              key: NEO4J_USERNAME
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neo4j-auth
              key: NEO4J_AUTH
              # Extract password part after the /
        - name: PAGE_SIZE
          valueFrom:
            configMapKeyRef:
              name: data-loader-config
              key: DEFAULT_PAGE_SIZE
        - name: MAX_RESULTS
          valueFrom:
            configMapKeyRef:
              name: data-loader-config
              key: DEFAULT_MAX_RESULTS
        - name: START_AT
          value: "0"
        volumeMounts:
        - name: app-source
          mountPath: /app
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: app-source
        configMap:
          name: app-source-code
          defaultMode: 0755
      initContainers:
      - name: wait-for-neo4j
        image: registry.redhat.io/ubi8/ubi-minimal:latest
        command: ['sh', '-c']
        args:
        - |
          echo "Waiting for Neo4j to be ready..."
          until timeout 3 bash -c "</dev/tcp/neo4j/7687" 2>/dev/null; do
            echo "Neo4j not ready, waiting 10s..."
            sleep 10
          done
          echo "Neo4j is ready!"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-source-code
  namespace: jira-cipoe-analytics
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: jira-data-loader
    app.kubernetes.io/component: source-code
data:
  jira_neo4j_loader.py: |
    #!/usr/bin/env python3
    """
    JIRA CIPOE to Neo4j Graph Database Loader

    This script queries JIRA for CIPOE issues and their linked issues,
    then stores the relationships in a Neo4j graph database for analysis.

    Security notes:
    - Credentials are provided via environment variables from Kubernetes secrets
    - No secrets are written to disk or source control
    """
    from __future__ import annotations
    import os
    import sys
    import json
    import time
    import logging
    from typing import Dict, Any, List, Optional
    from urllib.parse import urlparse

    try:
        import requests
        from neo4j import GraphDatabase
    except ImportError as e:
        print(f"Missing dependency: {e}. Install with: pip install -r requirements.txt", file=sys.stderr)
        sys.exit(1)

    # Configuration from environment
    JIRA_BASE_URL = os.getenv("JIRA_BASE_URL", "https://issues.redhat.com").rstrip("/")
    JIRA_TOKEN = os.getenv("JIRA_TOKEN")
    NEO4J_URI = os.getenv("NEO4J_URI", "bolt://neo4j:7687")
    NEO4J_USERNAME = os.getenv("NEO4J_USERNAME", "neo4j")
    NEO4J_PASSWORD = os.getenv("NEO4J_PASSWORD")

    # JIRA API configuration
    SEARCH_FIELDS = ["key", "summary", "issuelinks", "issuetype", "status", "created", "updated"]
    SEARCH_ENDPOINT = "/rest/api/2/search"
    ISSUE_ENDPOINT = "/rest/api/2/issue/{key}"

    # Pagination settings
    DEFAULT_PAGE_SIZE = 100
    DEFAULT_MAX_RESULTS = 1000

    # Logging
    logging.basicConfig(
        level=logging.INFO,
        format="%(asctime)s %(levelname)s [%(name)s] %(message)s"
    )
    logger = logging.getLogger("cipoe-neo4j-loader")


    class Neo4jConnection:
        """Neo4j database connection manager"""
        
        def __init__(self, uri: str, username: str, password: str):
            self.driver = GraphDatabase.driver(uri, auth=(username, password))
        
        def close(self):
            if self.driver:
                self.driver.close()
        
        def execute_query(self, query: str, parameters: Dict = None):
            """Execute a Cypher query"""
            with self.driver.session() as session:
                return session.run(query, parameters or {})
        
        def create_indexes(self):
            """Create necessary indexes for performance"""
            queries = [
                "CREATE INDEX cipoe_key_idx IF NOT EXISTS FOR (c:CIPOE) ON (c.key)",
                "CREATE INDEX issue_key_idx IF NOT EXISTS FOR (i:Issue) ON (i.key)",
                "CREATE INDEX cipoe_status_idx IF NOT EXISTS FOR (c:CIPOE) ON (c.status)",
                "CREATE INDEX issue_status_idx IF NOT EXISTS FOR (i:Issue) ON (i.status)",
            ]
            for query in queries:
                try:
                    self.execute_query(query)
                    logger.info(f"Index created: {query}")
                except Exception as e:
                    logger.warning(f"Index creation failed: {e}")


    class JiraClient:
        """JIRA API client with retry logic"""
        
        def __init__(self, base_url: str, token: str):
            self.base_url = base_url.rstrip("/")
            # Clean token of any whitespace/newlines 
            clean_token = token.strip()
            self.headers = {
                "Authorization": f"Bearer {clean_token}",
                "Accept": "application/json",
                "Content-Type": "application/json",
            }
            self.session = requests.Session()
        
        def safe_request(self, method: str, url: str, **kwargs) -> requests.Response:
            """Request with retry/backoff for rate limiting"""
            max_attempts = 5
            backoff = 1.0
            
            for attempt in range(1, max_attempts + 1):
                resp = self.session.request(method, url, timeout=30, headers=self.headers, **kwargs)
                
                if resp.status_code < 400:
                    return resp
                
                if resp.status_code in (429,) or 500 <= resp.status_code < 600:
                    logger.warning(
                        f"Request to {url} returned {resp.status_code}. "
                        f"Attempt {attempt}/{max_attempts}. Backing off {backoff}s"
                    )
                    time.sleep(backoff)
                    backoff = min(backoff * 2, 8)
                    continue
                
                # Client errors - don't retry
                resp.raise_for_status()
            
            return resp
        
        def search_cipoe(self, start_at: int = 0, max_results: int = 100, include_zero_links: bool = False) -> Dict[str, Any]:
            """Search for CIPOE issues with pagination"""
            url = f"{self.base_url}{SEARCH_ENDPOINT}"
            
            # Test with specific CIPOE ticket
            jql_query = "key = CIPOE-13879"
            logger.info("Searching for specific CIPOE ticket: CIPOE-13879")
            
            payload = {
                "jql": jql_query,
                "fields": ",".join(SEARCH_FIELDS),
                "startAt": start_at,
                "maxResults": max_results,
            }
            
            resp = self.safe_request("GET", url, params=payload)
            resp.raise_for_status()
            return resp.json()


    def validate_environment():
        """Validate required environment variables"""
        missing = []
        
        if not JIRA_TOKEN:
            missing.append("JIRA_TOKEN")
        if not NEO4J_PASSWORD:
            missing.append("NEO4J_PASSWORD")
        
        if missing:
            logger.error(f"Missing required environment variables: {', '.join(missing)}")
            sys.exit(1)


    def main():
        """Main data loading process"""
        import argparse
        
        parser = argparse.ArgumentParser(description="Load JIRA CIPOE data into Neo4j")
        parser.add_argument("--page-size", type=int, default=DEFAULT_PAGE_SIZE,
                           help="Number of issues to process per page")
        parser.add_argument("--max-results", type=int, default=DEFAULT_MAX_RESULTS,
                           help="Maximum number of issues to process")
        parser.add_argument("--start-at", type=int, default=0,
                           help="Starting offset for pagination")
        parser.add_argument("--dry-run", action="store_true",
                           help="Test connections without modifying data")
        parser.add_argument("--include-zero-links", action="store_true",
                           help="Include CIPOE tickets with zero linked issues (default: exclude them)")
        parser.add_argument("--stomp", action="store_true",
                           help="Clear all existing data before loading (stomping behavior)")
        
        args = parser.parse_args()
        
        # Validate environment
        validate_environment()
        
        # Initialize connections
        logger.info("Connecting to Neo4j...")
        neo4j_conn = None
        jira_client = None
        
        try:
            neo4j_password = NEO4J_PASSWORD
            if '/' in neo4j_password:
                neo4j_password = neo4j_password.split('/')[-1]
                
            neo4j_conn = Neo4jConnection(NEO4J_URI, NEO4J_USERNAME, neo4j_password)
            jira_client = JiraClient(JIRA_BASE_URL, JIRA_TOKEN)
            
            # Test connections
            logger.info("Testing Neo4j connection...")
            neo4j_conn.execute_query("RETURN 1 as test")
            print("Connected to Neo4j successfully")
            
            logger.info("Testing JIRA connection...")
            test_search = jira_client.search_cipoe(start_at=0, max_results=1, include_zero_links=args.include_zero_links)
            logger.info(f"JIRA connection successful. Total CIPOE issues: {test_search.get('total', 'unknown')}")
            
            if args.dry_run:
                logger.info("Dry run completed successfully")
                return
            
            # Handle stomping behavior - clear existing data
            if args.stomp:
                logger.info("Stomping mode: Clearing all existing data...")
                neo4j_conn.execute_query("MATCH (n) DETACH DELETE n")
                logger.info("All existing data cleared")
            
            # Create indexes
            logger.info("Creating Neo4j indexes...")
            neo4j_conn.create_indexes()
            
            # Start data loading
            total_processed = 0
            start_at = args.start_at
            
            while total_processed < args.max_results:
                page_size = min(args.page_size, args.max_results - total_processed)
                
                logger.info(f"Fetching CIPOE issues: offset={start_at}, limit={page_size}")
                
                try:
                    search_result = jira_client.search_cipoe(start_at=start_at, max_results=page_size, include_zero_links=args.include_zero_links)
                    issues = search_result.get("issues", [])
                    
                    if not issues:
                        logger.info("No more issues found")
                        break
                    
                    print(f"Loading {len(issues)} issues into Neo4j...")
                    
                    # Simple loading for basic functionality
                    for issue in issues:
                        query = """
                        MERGE (i:Issue {key: $key})
                        SET i.summary = $summary,
                            i.status = $status,
                            i.created = $created,
                            i.updated = $updated
                        """
                        fields = issue.get("fields", {})
                        params = {
                            "key": issue.get("key"),
                            "summary": fields.get("summary"),
                            "status": (fields.get("status") or {}).get("name"),
                            "created": fields.get("created"),
                            "updated": fields.get("updated"),
                        }
                        neo4j_conn.execute_query(query, params)
                    
                    total_processed += len(issues)
                    print(f"Loaded {total_processed} total issues")
                    
                    # Update pagination
                    start_at += len(issues)
                    
                    # Rate limiting
                    time.sleep(1)
                    
                except Exception as e:
                    logger.error(f"Error processing page starting at {start_at}: {e}")
                    break
            
            print(f"Data load completed successfully! Total issues loaded: {total_processed}")
            
        except Exception as e:
            logger.error(f"Data loading failed: {e}")
            sys.exit(1)
        
        finally:
            if neo4j_conn:
                neo4j_conn.close()


    if __name__ == "__main__":
        main()
