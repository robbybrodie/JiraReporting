apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: jira-cipoe-analytics
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: jira-analytics
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 7474
    targetPort: 7474
    protocol: TCP
  - name: bolt
    port: 7687
    targetPort: 7687
    protocol: TCP
  selector:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/component: database
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: neo4j-browser
  namespace: jira-cipoe-analytics
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: jira-analytics
spec:
  to:
    kind: Service
    name: neo4j
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
