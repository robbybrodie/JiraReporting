apiVersion: batch/v1
kind: CronJob
metadata:
  name: incremental-cipoe-data-load
  namespace: jira-cipoe-analytics
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: jira-data-loader
    app.kubernetes.io/component: incremental-load
    app.kubernetes.io/part-of: jira-analytics
spec:
  # Run every 6 hours
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: jira-data-loader
        app.kubernetes.io/component: incremental-load
        job-type: incremental-load
    spec:
      backoffLimit: 2
      completions: 1
      parallelism: 1
      activeDeadlineSeconds: 3600  # 1 hour max
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jira-data-loader
            app.kubernetes.io/component: incremental-load
            job-type: incremental-load
        spec:
          restartPolicy: Never
          serviceAccountName: default
          containers:
          - name: incremental-loader
            image: registry.redhat.io/ubi8/python-39:latest
            imagePullPolicy: Always
            command: ["/bin/bash"]
            args:
            - -c
            - |
              set -e
              echo "Installing dependencies..."
              pip install requests neo4j
              
              echo "Starting incremental CIPOE data load..."
              # Load smaller batches more frequently for incremental updates
              python /app/jira_neo4j_loader.py \
                --page-size 25 \
                --max-results 500 \
                --start-at 0
              
              echo "Incremental data load completed successfully"
            env:
            - name: JIRA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: jira-credentials
                  key: JIRA_BASE_URL
            - name: JIRA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jira-credentials
                  key: JIRA_TOKEN
            - name: NEO4J_URI
              valueFrom:
                configMapKeyRef:
                  name: data-loader-config
                  key: NEO4J_URI
            - name: NEO4J_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: data-loader-config
                  key: NEO4J_USERNAME
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: NEO4J_AUTH
            volumeMounts:
            - name: app-source
              mountPath: /app
            resources:
              requests:
                memory: "256Mi"
                cpu: "125m"
              limits:
                memory: "512Mi"
                cpu: "250m"
          volumes:
          - name: app-source
            configMap:
              name: app-source-code
              defaultMode: 0755
