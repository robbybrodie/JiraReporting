apiVersion: v1
kind: ConfigMap
metadata:
  name: visualization-app
  namespace: jira-cipoe-analytics
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/part-of: jira-analytics
data:
  visualization_app.py: |
    from flask import Flask, render_template, jsonify, request
    from neo4j import GraphDatabase
    import json
    import os
    import logging

    app = Flask(__name__)
    logging.basicConfig(level=logging.INFO)

    # Neo4j connection
    NEO4J_URI = os.getenv('NEO4J_URI', 'neo4j://neo4j:7687')
    NEO4J_USER = os.getenv('NEO4J_USER', 'neo4j')
    NEO4J_PASSWORD = os.getenv('NEO4J_PASSWORD', 'password')

    driver = None

    def get_neo4j_driver():
        global driver
        if driver is None:
            driver = GraphDatabase.driver(NEO4J_URI, auth=(NEO4J_USER, NEO4J_PASSWORD))
        return driver

    def run_query(query, parameters=None):
        """Execute a Cypher query and return results"""
        try:
            with get_neo4j_driver().session() as session:
                result = session.run(query, parameters or {})
                return [record.data() for record in result]
        except Exception as e:
            app.logger.error(f"Query error: {e}")
            return []

    @app.route('/')
    def index():
        return render_template('index.html')

    @app.route('/api/stats')
    def get_stats():
        """Get basic statistics about the data"""
        stats = {}
        
        # Count total issues
        result = run_query("MATCH (n:Issue) RETURN count(n) as count")
        stats['total_issues'] = result[0]['count'] if result else 0
        
        # Count CIPOE issues
        result = run_query("MATCH (n:Issue) WHERE n.key CONTAINS 'CIPOE' RETURN count(n) as count")
        stats['cipoe_issues'] = result[0]['count'] if result else 0
        
        # Count relationships
        result = run_query("MATCH ()-[r]->() RETURN count(r) as count")
        stats['total_relationships'] = result[0]['count'] if result else 0
        
        # Priority breakdown
        result = run_query("""
            MATCH (issue:Issue) 
            WHERE issue.key CONTAINS 'CIPOE' AND issue.priority IS NOT NULL
            RETURN issue.priority as priority, count(issue) as count
            ORDER BY count DESC
        """)
        stats['priority_breakdown'] = result
        
        # Status breakdown
        result = run_query("""
            MATCH (issue:Issue) 
            WHERE issue.key CONTAINS 'CIPOE' AND issue.status IS NOT NULL
            RETURN issue.status as status, count(issue) as count
            ORDER BY count DESC
        """)
        stats['status_breakdown'] = result
        
        return jsonify(stats)

    @app.route('/api/issues')
    def get_issues():
        """Get paginated list of issues"""
        limit = int(request.args.get('limit', 25))
        skip = int(request.args.get('skip', 0))
        search = request.args.get('search', '')
        
        query = """
            MATCH (issue:Issue) 
            WHERE issue.key CONTAINS 'CIPOE'
        """
        
        if search:
            query += " AND (toLower(issue.summary) CONTAINS toLower($search) OR toLower(issue.key) CONTAINS toLower($search))"
        
        query += """
            RETURN issue.key as key, issue.summary as summary, issue.status as status, 
                   issue.priority as priority, issue.assignee as assignee, issue.created as created
            ORDER BY issue.created DESC
            SKIP $skip LIMIT $limit
        """
        
        parameters = {'skip': skip, 'limit': limit}
        if search:
            parameters['search'] = search
        
        issues = run_query(query, parameters)
        return jsonify(issues)

    @app.route('/api/issue/<issue_key>')
    def get_issue_details(issue_key):
        """Get detailed information about a specific issue"""
        query = """
            MATCH (issue:Issue {key: $key})
            RETURN issue
        """
        result = run_query(query, {'key': issue_key})
        
        if not result:
            return jsonify({'error': 'Issue not found'}), 404
        
        issue = result[0]['issue']
        
        # Get related issues
        related_query = """
            MATCH (issue:Issue {key: $key})-[r]-(related:Issue)
            RETURN type(r) as relationship_type, related.key as key, related.summary as summary
            LIMIT 20
        """
        related = run_query(related_query, {'key': issue_key})
        
        return jsonify({
            'issue': issue,
            'related': related
        })

    @app.route('/api/graph')
    def get_graph_data():
        """Get graph data for visualization"""
        limit = int(request.args.get('limit', 50))
        
        query = """
            MATCH (cipoe:Issue)-[r]-(connected:Issue)
            WHERE cipoe.key CONTAINS 'CIPOE'
            RETURN cipoe.key as source_key, cipoe.summary as source_summary,
                   connected.key as target_key, connected.summary as target_summary,
                   type(r) as relationship_type
            LIMIT $limit
        """
        
        results = run_query(query, {'limit': limit})
        
        # Transform data for visualization
        nodes = {}
        edges = []
        
        for record in results:
            # Add source node
            if record['source_key'] not in nodes:
                nodes[record['source_key']] = {
                    'id': record['source_key'],
                    'label': record['source_key'],
                    'title': record['source_summary'],
                    'color': '#ff6b6b' if 'CIPOE' in record['source_key'] else '#4ecdc4'
                }
            
            # Add target node
            if record['target_key'] not in nodes:
                nodes[record['target_key']] = {
                    'id': record['target_key'],
                    'label': record['target_key'],
                    'title': record['target_summary'],
                    'color': '#ff6b6b' if 'CIPOE' in record['target_key'] else '#4ecdc4'
                }
            
            # Add edge
            edges.append({
                'from': record['source_key'],
                'to': record['target_key'],
                'label': record['relationship_type'],
                'color': '#999999'
            })
        
        return jsonify({
            'nodes': list(nodes.values()),
            'edges': edges
        })

    @app.route('/api/search')
    def search_issues():
        """Search issues by text"""
        q = request.args.get('q', '')
        if not q:
            return jsonify([])
        
        query = """
            MATCH (issue:Issue)
            WHERE (toLower(issue.summary) CONTAINS toLower($search) 
                   OR toLower(issue.key) CONTAINS toLower($search))
            RETURN issue.key as key, issue.summary as summary, issue.status as status
            LIMIT 20
        """
        
        results = run_query(query, {'search': q})
        return jsonify(results)

    @app.route('/health')
    def health():
        """Health check endpoint"""
        try:
            with get_neo4j_driver().session() as session:
                session.run("RETURN 1")
            return jsonify({'status': 'healthy'})
        except Exception as e:
            return jsonify({'status': 'unhealthy', 'error': str(e)}), 500

    if __name__ == '__main__':
        app.run(host='0.0.0.0', port=8080, debug=False)
