apiVersion: v1
kind: Service
metadata:
  name: visualization-service
  namespace: jira-cipoe-analytics
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app: visualization-service
    component: frontend
    app.kubernetes.io/part-of: jira-analytics
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: visualization-service
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: visualization-dashboard
  namespace: jira-cipoe-analytics
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app: visualization-service
    component: frontend
    app.kubernetes.io/part-of: jira-analytics
spec:
  to:
    kind: Service
    name: visualization-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
